name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'JSON'
          {
            "name": "cantique-tabernacle",
            "version": "1.0.0",
            "private": true
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "mg.tabernacle.fihirana",
            "appName": "Fihirana Tabernacle",
            "webDir": "www",
            "backgroundColor": "#dff3e4"
          }
          JSON

      - name: Install Capacitor
        run: npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/app@^8 @capacitor/status-bar@^8

      - name: Create Android project
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

